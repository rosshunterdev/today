name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit and component tests
        run: npm test
      - name: Type-check and build
        run: npm run build

  e2e:
    name: End-to-end (desktop + phone)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright tests
        run: npm run e2e
      - name: Upload screenshots and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: |
            e2e/screenshots/
            playwright-report/
            test-results/
          retention-days: 14

  rls:
    name: Row-level security (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # A throwaway Supabase in Docker, built from supabase/migrations. No secrets, and no cloud project is touched.
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,mailpit,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
      # The local keys are the CLI's fixed development keys, not secrets.
      - name: Point the tests at it
        run: |
          supabase status -o json | jq -r '
            "SUPABASE_TEST_URL=\(.API_URL)",
            "SUPABASE_TEST_PUBLISHABLE_KEY=\(.ANON_KEY)",
            "SUPABASE_TEST_SECRET_KEY=\(.SERVICE_ROLE_KEY)"' >> "$GITHUB_ENV"
      - name: Row-level security tests
        run: npm run test:rls
