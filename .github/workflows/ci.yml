name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit and component tests
        run: npm test
      - name: Type-check and build
        run: npm run build

  e2e:
    name: End-to-end (desktop + phone)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright tests
        run: npm run e2e
      - name: Upload screenshots and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: |
            e2e/screenshots/
            playwright-report/
            test-results/
          retention-days: 14

  rls:
    name: Row-level security (staging Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
      SUPABASE_TEST_SECRET_KEY: ${{ secrets.SUPABASE_TEST_SECRET_KEY }}
    steps:
      # Forks and fresh clones have no staging secrets: skip rather than fail.
      - name: Skip without staging secrets
        if: env.SUPABASE_TEST_SECRET_KEY == ''
        run: echo "::notice::No staging secrets; row-level security tests skipped."
      - if: env.SUPABASE_TEST_SECRET_KEY != ''
        uses: actions/checkout@v5
      - if: env.SUPABASE_TEST_SECRET_KEY != ''
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: env.SUPABASE_TEST_SECRET_KEY != ''
        run: npm ci
      # Free projects pause after a week unused: if this fails to connect, restore today-staging in the dashboard.
      - name: Row-level security tests
        if: env.SUPABASE_TEST_SECRET_KEY != ''
        run: npm run test:rls
